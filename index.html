<!doctype html>
<html lang="id">

    />
    <!-- Tailwind CSS -->

    <script src="js/tailwind-config.js"></script>
    <script>
      try {
        if (sessionStorage.getItem("portalAkademik.session"))
          document.documentElement.classList.add("authed");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
        cursor: pointer;
      }
      .pointer-events-none,
      .fixed.inset-0.z-[-1] {
        pointer-events: none !important;
      }
      html.authed #authScreen {
        display: none !important;
        pointer-events: none !important;
      }
      .task-card-completed {
        background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 70%) !important;
        border: 2px solid #86efac !important;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.14) !important;
      }
      .task-title-completed {
        text-decoration: line-through;
        text-decoration-color: #10b981;
        text-decoration-thickness: 2px;
        color: #4b5563 !important;
      }
    </style>
  </head>

        <form id="authForm" class="space-y-4" novalidate></form>
